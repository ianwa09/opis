            function addDatasetSource(data, source) {
                (data.features || []).forEach(function (feature) {
                    feature.properties = feature.properties || {};
                    feature.properties.DATA_SOURCE = source;
                });
                return data;
            }

            function convertWebMercatorGeoJSONToLongitudeLatitude(data) {
                var earthRadiusMeters = 6378137;

                function convertCoordinates(coordinates) {
                    if (!Array.isArray(coordinates)) return coordinates;

                    if (
                        coordinates.length >= 2 &&
                        typeof coordinates[0] === 'number' &&
                        typeof coordinates[1] === 'number'
                    ) {
                        var x = coordinates[0];
                        var y = coordinates[1];

                        // GeoJSON passed to Leaflet must use longitude and latitude.
                        // Only convert projected meter values so already-correct data
                        // cannot be transformed a second time.
                        if (Math.abs(x) > 180 || Math.abs(y) > 90) {
                            var longitude = (x / earthRadiusMeters) * (180 / Math.PI);
                            var latitude = (
                                2 * Math.atan(Math.exp(y / earthRadiusMeters)) -
                                Math.PI / 2
                            ) * (180 / Math.PI);
                            return [longitude, latitude].concat(coordinates.slice(2));
                        }

                        return coordinates;
                    }

                    return coordinates.map(convertCoordinates);
                }

                (data.features || []).forEach(function (feature) {
                    if (feature.geometry && feature.geometry.coordinates) {
                        feature.geometry.coordinates = convertCoordinates(
                            feature.geometry.coordinates
                        );
                    }
                });

                // The converted coordinates follow the GeoJSON longitude/latitude
                // convention, so the source EPSG:3857 declaration no longer applies.
                if (data.crs) delete data.crs;
                return data;
            }
